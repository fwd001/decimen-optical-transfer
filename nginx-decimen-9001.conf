# Decimen Optical Transfer — static hosting config (server block)
# Serves the Vite build in ./dist on port 9001.
# Include this in your nginx http{} context (or as a standalone conf with
# `nginx -c`), then `nginx -s reload`.
#
# Notes:
#  * `include mime.types;` resolves against the nginx prefix (default C:/nginx/conf).
#    If this file lives outside that dir and the include fails, drop it and expand
#    the `types {}` block below instead.
#  * The `types {}` block MERGES with the included mapping (later entries win).

server {
    listen 9001;
    server_name _;

    root C:/Users/Admin/Desktop/fwd/code/decimen-optical-transfer/dist;
    index index.html;

    include mime.types;
    types {
        application/wasm              wasm;
        application/manifest+json     webmanifest;
    }

    # Security headers — inherited by locations that define no add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Service worker + Workbox runtime must never be cached by the browser,
    # or PWA updates will never reach clients.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location ~* ^/workbox-.*\.js$ {
        expires -1;
        try_files $uri =404;
    }

    # HTML pages and settings.json — always revalidate so new releases ship.
    location ~* \.(html?|json)$ {
        expires -1;
        try_files $uri =404;
    }

    # Everything else: /, /send/, /receive/ (directory index), images,
    # manifest.webmanifest, icons, settings.json fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
